name: KAI Daily Briefing

on:
  schedule:
    # UTC 기준 22:00 == KST 07:00 (평일: 월~금 UTC 기준 전날 밤이므로 요일 매핑 주의)
    # 아래는 KST 월~금 07:00에 맞춘 cron (UTC 일~목 22:00)
    - cron: "0 22 * * 0-4"
  workflow_dispatch: {}  # 수동 실행 버튼

jobs:
  run-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 브리핑 생성 및 발송
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: 587
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.SMTP_USER }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python main.py

      - name: 브리핑 HTML 아티팩트 저장
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-briefing
          path: latest_briefing.html
          retention-days: 30

      - name: 소스 헬스체크 리포트 아티팩트 저장
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-health-report
          path: health_report.json
          retention-days: 30
